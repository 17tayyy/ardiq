name: Feature request
description: Suggest a capability ArdiQ is missing
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that ArdiQ makes hard or impossible? Describe
        the situation, not the solution — it often has a shorter answer than the
        one you had in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: If you have an API in mind, sketch it.
      render: python

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: >
        How do Celery, arq, taskiq or dramatiq handle this? Useful even when the
        answer is "badly".

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the [docs](https://ardiq.bytay.dev) and open issues
          required: true
